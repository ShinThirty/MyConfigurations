# Read by the wrapper in the AUR's helium-browser-bin (Arch only), one or more
# flags per line. On macOS and Windows, Helium follows the system's dark mode.

# Dark browser UI, and prefers-color-scheme: dark for pages
--force-dark-mode

# Cookies are encrypted with a key Helium keeps in the Secret Service, so in
# KeePassXC's Login database; under Hyprland, Chromium would use its built-in
# key. Helium reads the key when it starts, and KeePassXC asks to unlock Login
# first; without the key, Helium can't read its cookies and you're signed out
--password-store=gnome-libsecret
