# Read by the wrapper in the AUR's helium-browser-bin (Arch only), one or more
# flags per line. On macOS and Windows, Helium follows the system's dark mode.

# Dark browser UI, and prefers-color-scheme: dark for pages
--force-dark-mode

# Cookies are encrypted with Chromium's built-in key, not a key stored in the
# Secret Service (KeePassXC), so Helium starts without a KeePassXC prompt and
# reads its cookies while KeePassXC is closed
--password-store=basic
