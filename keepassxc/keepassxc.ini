# KeePassXC's settings on every machine. apply-settings.sh (macOS, Arch) and
# apply-settings.ps1 (Windows) merge them into KeePassXC's own keepassxc.ini,
# leaving the keys this file doesn't name alone, and keepassxc_local.ini's
# into the file KeePassXC keeps for settings that stay on the machine. Never
# copy [KeeShare]'s Own here: it's the machine's private key, and this repo is
# public.

[Browser]
Enabled=true
SearchInAllDatabases=true

# The Secret Service, which only Arch's KeePassXC has: apps read the secrets it
# exposes without a prompt. KeePassXC on macOS and Windows ignores it.
[FdoSecrets]
ConfirmAccessItem=false

# Saves write straight into the database file: UseAtomicSaves=false here and
# keepassxc_local.ini's UseDirectWriteSaves, Settings > General's "Directly
# write to database file". On Arch, Qt can't put a new file in place on
# tp-share's mount, so KeePassXC's other two saves fail there, and "Temporary
# file moved into place" deletes the share's database before it fails.
# BackupBeforeSave copies the database first, to a folder on the machine,
# BackupFilePathPattern, which apply-settings.sh and apply-settings.ps1 set:
# KeePassXC expands {DB_FILENAME} in it, but not ~ or environment variables.
[General]
BackupBeforeSave=true
MinimizeAfterUnlock=true
OpenPreviousDatabasesOnStartup=false
RememberLastDatabases=false
RememberLastKeyFiles=false
UpdateCheckMessageShown=true
UseAtomicSaves=false

[GUI]
CheckForUpdates=false
MinimizeOnClose=true
MinimizeOnStartup=true
MinimizeToTray=true
ShowTrayIcon=true
TrayIconAppearance=colorful

[KeeShare]
QuietSuccess=true

[PasswordGenerator]
AdditionalChars=
EASCII=false
ExcludedChars=
Length=20
SpecialChars=true

[Security]
LockDatabaseIdle=true
LockDatabaseIdleSeconds=3600
