# KeePassXC's settings on every machine. apply-settings.sh (macOS, Arch) and
# apply-settings.ps1 (Windows) merge them into KeePassXC's own keepassxc.ini,
# leaving the keys this file doesn't name alone. Never copy [KeeShare]'s Own
# here: it's the machine's private key, and this repo is public.

[Browser]
Enabled=true
SearchInAllDatabases=true

[General]
MinimizeAfterUnlock=true
OpenPreviousDatabasesOnStartup=false
RememberLastDatabases=false
RememberLastKeyFiles=false
UpdateCheckMessageShown=true
UseAtomicSaves=false

[GUI]
CheckForUpdates=false
MinimizeOnClose=true
MinimizeOnStartup=true
MinimizeToTray=true
ShowTrayIcon=true
TrayIconAppearance=colorful

[KeeShare]
QuietSuccess=true

[PasswordGenerator]
AdditionalChars=
EASCII=false
ExcludedChars=
Length=20
SpecialChars=true

[Security]
LockDatabaseIdle=true
LockDatabaseIdleSeconds=3600
