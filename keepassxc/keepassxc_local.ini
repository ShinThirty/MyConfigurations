# KeePassXC's settings on every machine that it keeps in its local file, the
# one for settings that stay on the machine: ~/.local/state/keepassxc on Arch,
# ~/Library/Caches/KeePassXC on macOS, and keepassxc_local.ini beside
# keepassxc.ini on Windows. apply-settings.sh and apply-settings.ps1 merge them
# in as they do keepassxc.ini's, leaving the keys this file doesn't name alone.

# keepassxc.ini's [General] has why saves write straight into the file
[General]
UseDirectWriteSaves=true
